<!doctype html>
<!--
  Source for public/og-default.png (the link preview card).

  To regenerate:
    1. cp scripts/og-source.html public/__og-source.html
    2. cp node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2 \
         public/__og-inter.woff2
    3. pnpm dev, open http://localhost:4321/__og-source.html in a 1200x630 viewport
    4. screenshot it, save as public/og-default.png
    5. rm public/__og-source.html public/__og-inter.woff2
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>OG source</title>
    <style>
      @font-face {
        font-family: 'Inter Variable';
        font-style: normal;
        font-weight: 100 900;
        src: url('/__og-inter.woff2') format('woff2-variations');
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; overflow: hidden; }
      body {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 84px 88px;
        background: #12161f;
        background-image: radial-gradient(circle at 88% 8%, rgba(74, 128, 240, 0.35), transparent 55%);
        color: #eef1f6;
        font-family: 'Inter Variable', system-ui, sans-serif;
      }
      .rule { width: 96px; height: 6px; border-radius: 3px; background: #4a80f0; }
      h1 { margin-top: 40px; font-size: 96px; font-weight: 700; letter-spacing: -0.035em; }
      p.tagline { margin-top: 20px; font-size: 40px; font-weight: 400; color: #a7b0c0; }
      footer { display: flex; align-items: center; justify-content: space-between; font-size: 28px; color: #8b95a7; }
      footer span.domain { color: #eef1f6; font-weight: 600; }
    </style>
  </head>
  <body>
    <div>
      <div class="rule"></div>
      <h1>Selim Arda Çevik</h1>
      <p class="tagline">Platform engineer · DevOps and full-stack</p>
    </div>
    <footer>
      <span class="domain">selimardacevik.com</span>
      <span>EN · TR</span>
    </footer>
  </body>
</html>
